# Cloudflare real-IP trust ranges belong in /etc/nginx/snippets/hoplens-realip.conf.
# Generate that snippet ONLY from https://api.cloudflare.com/client/v4/ips.
server {
    listen 80;
    listen [::]:80;
    server_name ip.nodecloak.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/hoplens-acme; }
    location / { return 301 https://ip.nodecloak.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ip.nodecloak.com;
    ssl_certificate /etc/letsencrypt/live/ip.nodecloak.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ip.nodecloak.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/hoplens/current/dist;
    index index.html;
    access_log off;
    error_log /var/log/nginx/hoplens-error.log warn;
    include /etc/nginx/snippets/hoplens-realip.conf;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Strict-Transport-Security "max-age=15552000" always;
    client_max_body_size 128k;

    location /api/ {
        proxy_pass http://127.0.0.1:11967;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header CF-Connecting-IPv6 "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 45s;
        proxy_buffering off;
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }
    location ~ /\. { deny all; }
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
